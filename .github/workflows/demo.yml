# Builds the free demo and keeps it at fixed addresses on the "demo" release:
# https://github.com/Chrisocal21/supplyline/releases/download/demo/Supplyline-Demo-Setup.exe
# https://github.com/Chrisocal21/supplyline/releases/download/demo/Supplyline-Demo-arm64.dmg (Apple silicon)
# https://github.com/Chrisocal21/supplyline/releases/download/demo/Supplyline-Demo-x64.dmg (Intel Mac)
# Run it from the Actions tab, or push a tag like demo-v0.139.
name: Demo build
on:
  workflow_dispatch:
  push:
    tags: ['demo-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view demo || gh release create demo --title "Free demo" --notes "The free demo for Windows and Mac. Map 1, ends at Tier 2." --prerelease --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build
      - run: node tools/build-demo.cjs
      - run: gh release upload demo release-demo/Supplyline-Demo-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build
      - run: node tools/build-demo.cjs --mac
      - run: gh release upload demo release-demo/Supplyline-Demo-arm64.dmg release-demo/Supplyline-Demo-x64.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
