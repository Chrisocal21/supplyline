# Builds the Windows installer and publishes it as a GitHub release. Push a tag that matches package.json, like v0.38.0, to run it; the desktop app picks
# the new release up on its own and offers a restart.
name: Release Windows build
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx vite build
      # Make the release first, so the uploads do not race to create it.
      - run: gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "Windows installer. Installed copies update themselves." --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publish it once every file is up.
      - run: gh release edit ${{ github.ref_name }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
